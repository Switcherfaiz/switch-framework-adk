<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switch Framework ADK — Dual Chat</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">switch-framework-adk</p>
      <h1>Dual parallel runners</h1>
      <p class="sub">Two agents, two Emitters, streamed in parallel via SSE.</p>
    </div>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <main class="grid">
    <section class="pane" data-agent="a">
      <header class="pane-head">
        <h2>Assistant A</h2>
        <span class="tag" id="tools-a">tools</span>
      </header>
      <div class="out" id="out-a" aria-live="polite"></div>
      <form class="composer" id="form-a">
        <input id="input-a" type="text" placeholder="Message for Assistant A…" autocomplete="off" />
        <button type="submit">Run A</button>
      </form>
    </section>

    <section class="pane" data-agent="b">
      <header class="pane-head">
        <h2>Assistant B</h2>
        <span class="tag" id="tools-b">tools</span>
      </header>
      <div class="out" id="out-b" aria-live="polite"></div>
      <form class="composer" id="form-b">
        <input id="input-b" type="text" placeholder="Message for Assistant B…" autocomplete="off" />
        <button type="submit">Run B</button>
      </form>
    </section>
  </main>

  <footer class="foot">
    <button type="button" id="run-both">Run both in parallel</button>
    <button type="button" id="clear" class="ghost">Clear both</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
